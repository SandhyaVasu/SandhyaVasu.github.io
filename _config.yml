title: Sandhya Vasudevan
tagline: Computational systems biology — metabolic models, microbial communities,
  and the code that simulates them.
description: Computational systems biology — genome-scale metabolic modelling of
  microbial communities, and notes on the code behind it.
url: "https://sandhyavasu.github.io"
github_username: SandhyaVasu

# Posts and pages are written in Markdown; these layouts wrap them.
markdown: kramdown
permalink: /:year/:month/:title/

# Each project is a Markdown file in _projects/. output: false means they
# are rendered on the homepage rather than getting pages of their own.
collections:
  projects:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
