title: Sandhya Vasudevan
# Rendered as-is into the header, so the lab link lives here as markup.
tagline: 'PhD student working in Prof Karthik Raman''s <a href="https://ramanlab.github.io/" target="_blank" rel="noopener">Computational Systems Biology lab</a>, IITM'
# Plain text: this one goes into the meta description tag.
description: PhD student in Prof Karthik Raman's Computational Systems Biology lab
  at IIT Madras, working on genome-scale metabolic models of microbial communities.
url: "https://sandhyavasu.github.io"
github_username: SandhyaVasu

# Posts and pages are written in Markdown; these layouts wrap them.
markdown: kramdown
permalink: /:year/:month/:title/

# Each project is a Markdown file in _projects/. output: false means they
# are rendered on the homepage rather than getting pages of their own.
collections:
  projects:
    output: false
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
